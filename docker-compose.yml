# Despliegue en Coolify: recurso "Docker Compose" apuntando a este repositorio.
# Asigne el dominio público solo al servicio `frontend` (puerto 80).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.rbgct.cloud/webhook/financiera}
    expose:
      - "3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - API_UPSTREAM=backend:3000
    expose:
      - "80"
    depends_on:
      - backend
