version: '3.8'

services:
  backend-operaciones-prof:
    build: ./backend
    container_name: api_vinculados_prof
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - net_vinculados

  frontend-operaciones-prof:
    image: nginx:alpine
    container_name: web_vinculados_prof
    restart: unless-stopped
    ports:
      - "8070:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - net_vinculados
      - red_pro

networks:
  net_vinculados:
    driver: bridge
  red_pro:
    external: true