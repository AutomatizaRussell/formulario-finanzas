server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Ruta para servir tus archivos estáticos (frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Ruta para redirigir las peticiones a tu API (backend)
    location /api/ {
        # 1. Definir el resolver interno de Docker
        resolver 127.0.0.11 valid=30s;

        # 2. Asignar el nombre del servicio a una variable
        # Nota: Asegúrate de que este nombre sea EXACTAMENTE el nombre
        # que tiene el servicio de la API en Coolify.
        set $upstream_api "api_vinculados_prof";

        # 3. Proxy hacia la API
        proxy_pass http://$upstream_api:3000/;

        # Configuraciones necesarias para el proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Opcional: headers para que la API sepa quién es el cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}